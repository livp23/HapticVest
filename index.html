<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Haptic Vest Controller</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@400;600;700&display=swap');

    :root {
      --bg: #0a0a0f; --panel: #12121a; --border: #2a2a3a; --accent: #00e5ff;
      --accent2: #ff3d6b; --front-btn: #0d2b3e; --front-active: #00e5ff;
      --back-btn: #2b0d1e; --back-active: #ff3d6b; --text: #e0e0f0;
      --muted: #555570; --connected: #00ff99; --disconnected: #ff3d6b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; }

    body {
      background: var(--bg); color: var(--text); font-family: 'Rajdhani', sans-serif;
      min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px;
    }

    header {
      width: 100%; max-width: 500px; display: flex; justify-content: space-between;
      align-items: center; margin-bottom: 30px; padding: 15px;
      background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    }

    .status-group { display: flex; align-items: center; gap: 10px; }
    .status-dot { width: 10px; height: 10px; background: var(--disconnected); border-radius: 50%; transition: 0.3s; }
    .status-dot.connected { background: var(--connected); box-shadow: 0 0 10px var(--connected); }
    .status-text { font-family: 'Share+Tech+Mono', monospace; font-size: 0.8rem; color: var(--disconnected); }
    .status-text.connected { color: var(--connected); }

    button#connectBtn {
      background: transparent; border: 1px solid var(--accent); color: var(--accent);
      padding: 8px 16px; font-weight: 700; border-radius: 6px; cursor: pointer;
    }

    .grid-container {
      display: grid; grid-template-columns: 1fr 1fr; gap: 20px; width: 100%; max-width: 500px;
    }

    .section-label { 
      grid-column: span 2; font-size: 0.7rem; text-transform: uppercase; 
      color: var(--muted); border-bottom: 1px solid var(--border); margin-top: 10px;
      padding-bottom: 5px; letter-spacing: 2px;
    }

    .motor-btn {
      aspect-ratio: 1/1; background: var(--panel); border: 1px solid var(--border);
      border-radius: 16px; display: flex; flex-direction: column; justify-content: center;
      align-items: center; cursor: pointer; transition: 0.1s;
      touch-action: none; /* Prevents scrolling while holding */
    }

    .motor-btn span { font-size: 1.8rem; font-weight: 700; }
    .motor-btn label { font-size: 0.65rem; color: var(--muted); text-transform: uppercase; }

    .motor-btn.front { border-bottom: 4px solid var(--front-btn); }
    .motor-btn.front:active { background: var(--front-btn); border-color: var(--front-active); transform: scale(0.96); }
    
    .motor-btn.back { border-bottom: 4px solid var(--back-btn); }
    .motor-btn.back:active { background: var(--back-btn); border-color: var(--back-active); transform: scale(0.96); }

    #log { 
      width: 100%; max-width: 500px; background: #050508; border: 1px solid var(--border); 
      padding: 15px; border-radius: 8px; margin-top: 25px; font-family: 'Share+Tech+Mono'; 
      font-size: 0.75rem; color: var(--muted); min-height: 60px;
    }

    .disconnected .grid-container { opacity: 0.3; pointer-events: none; filter: grayscale(1); }
  </style>
</head>
<body class="disconnected">
  <header>
    <div class="status-group">
      <div id="statusDot" class="status-dot"></div>
      <div id="statusText" class="status-text">SYSTEM OFFLINE</div>
    </div>
    <button id="connectBtn" onclick="toggleConnection()">INITIALIZE</button>
  </header>

  <div class="grid-container">
    <div class="section-label">Anterior Haptic Array</div>
    <div class="motor-btn front" onpointerdown="trigger(1,1)" onpointerup="trigger(1,0)" onpointerleave="trigger(1,0)"><span>1</span><label>Upper Left</label></div>
    <div class="motor-btn front" onpointerdown="trigger(2,1)" onpointerup="trigger(2,0)" onpointerleave="trigger(2,0)"><span>2</span><label>Upper Right</label></div>
    <div class="motor-btn front" onpointerdown="trigger(3,1)" onpointerup="trigger(3,0)" onpointerleave="trigger(3,0)"><span>3</span><label>Lower Left</label></div>
    <div class="motor-btn front" onpointerdown="trigger(4,1)" onpointerup="trigger(4,0)" onpointerleave="trigger(4,0)"><span>4</span><label>Lower Right</label></div>
    
    <div class="section-label">Posterior Haptic Array</div>
    <div class="motor-btn back" onpointerdown="trigger(5,1)" onpointerup="trigger(5,0)" onpointerleave="trigger(5,0)"><span>5</span><label>Upper Left</label></div>
    <div class="motor-btn back" onpointerdown="trigger(6,1)" onpointerup="trigger(6,0)" onpointerleave="trigger(6,0)"><span>6</span><label>Upper Right</label></div>
    <div class="motor-btn back" onpointerdown="trigger(7,1)" onpointerup="trigger(7,0)" onpointerleave="trigger(7,0)"><span>7</span><label>Lower Left</label></div>
    <div class="motor-btn back" onpointerdown="trigger(8,1)" onpointerup="trigger(8,0)" onpointerleave="trigger(8,0)"><span>8</span><label>Lower Right</label></div>
  </div>

  <div id="log">> Awaiting connection...</div>

  <script>
    const SERVICE_UUID = '6e400001-b5a3-f393-e0a9-e50e24dcca9e';
    const CHARACTERISTIC_UUID = '6e400002-b5a3-f393-e0a9-e50e24dcca9e';
    let device = null; let characteristic = null;

    async function toggleConnection() {
      if (device && device.gatt.connected) { device.gatt.disconnect(); } 
      else { await connect(); }
    }

    async function connect() {
      try {
        log('Scanning for Haptic Vest...');
        device = await navigator.bluetooth.requestDevice({
          filters: [{ namePrefix: 'Hapt' }],
          optionalServices: [SERVICE_UUID]
        });
        const server = await device.gatt.connect();
        const service = await server.getPrimaryService(SERVICE_UUID);
        characteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);
        onConnected();
      } catch (err) { log('Error: ' + err.message); }
    }

    function onConnected() {
      document.getElementById('statusDot').classList.add('connected');
      document.getElementById('statusText').textContent = 'SYSTEM ONLINE';
      document.getElementById('statusText').classList.add('connected');
      document.body.classList.remove('disconnected');
      log('Protocol established with ' + device.name);
    }

    function onDisconnected() {
      document.getElementById('statusDot').classList.remove('connected');
      document.getElementById('statusText').textContent = 'SYSTEM OFFLINE';
      document.body.classList.add('disconnected');
      characteristic = null;
      log('Connection terminated.');
    }

    async function trigger(motorNum, state) {
      if (!characteristic) return;
      // !B + motor + 1 (start) or 0 (stop)
      const packet = `!B${motorNum}${state}\n`;
      const data = new TextEncoder().encode(packet);
      try {
        await characteristic.writeValueWithoutResponse(data);
      } catch (err) { console.log('TX Error'); }
    }

    function log(msg) { document.getElementById('log').innerHTML = '> ' + msg; }
  </script>
</body>
</html>
