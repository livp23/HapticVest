<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Haptic Vest Controller</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@400;600;700&display=swap');
    :root {
      --bg: #0a0a0f; --panel: #12121a; --border: #2a2a3a; --accent: #00e5ff;
      --accent2: #ff3d6b; --front-btn: #0d2b3e; --front-active: #00e5ff;
      --back-btn: #2b0d1e; --back-active: #ff3d6b; --text: #e0e0f0;
      --muted: #555570; --connected: #00ff99; --disconnected: #ff3d6b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      background: var(--bg); color: var(--text); font-family: 'Rajdhani', sans-serif;
      min-height: 100vh; display: flex; flex-direction: column; align-items: center;
      padding: 20px 16px; gap: 20px;
      background-image:
        radial-gradient(ellipse at 20% 0%, rgba(0,229,255,0.05) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 100%, rgba(255,61,107,0.05) 0%, transparent 60%);
    }
    h1 { font-family: 'Share Tech Mono', monospace; font-size: 1.1rem; letter-spacing: 0.2em; color: var(--accent); text-transform: uppercase; text-align: center; opacity: 0.9; }
    .status-bar { width: 100%; max-width: 420px; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .status-indicator { display: flex; align-items: center; gap: 8px; font-family: 'Share Tech Mono', monospace; font-size: 0.75rem; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--disconnected); box-shadow: 0 0 8px var(--disconnected); transition: all 0.3s ease; }
    .status-dot.connected { background: var(--connected); box-shadow: 0 0 8px var(--connected); animation: pulse 2s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    .status-text { color: var(--muted); font-family: 'Share Tech Mono', monospace; font-size: 0.7rem; }
    .status-text.connected { color: var(--connected); }
    .connect-btn { background: transparent; border: 1px solid var(--accent); color: var(--accent); font-family: 'Share Tech Mono', monospace; font-size: 0.75rem; padding: 8px 16px; border-radius: 8px; cursor: pointer; text-transform: uppercase; }
    .connect-btn.disconnect { border-color: var(--accent2); color: var(--accent2); }
    .motor-section { width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 8px; }
    .section-label { font-family: 'Share Tech Mono', monospace; font-size: 0.65rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); }
    .motor-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    .motor-btn { position: relative; aspect-ratio: 1; border-radius: 14px; border: 2px solid transparent; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; user-select: none; touch-action: none; overflow: hidden; }
    .motor-btn.front { background: var(--front-btn); border-color: rgba(0,229,255,0.2); }
    .motor-btn.front.active { background: rgba(0,229,255,0.15); border-color: var(--front-active); transform: scale(0.96); box-shadow: 0 0 15px rgba(0,229,255,0.2); }
    .motor-btn.back { background: var(--back-btn); border-color: rgba(255,61,107,0.2); }
    .motor-btn.back.active { background: rgba(255,61,107,0.15); border-color: var(--back-active); transform: scale(0.96); box-shadow: 0 0 15px rgba(255,61,107,0.2); }
    .motor-num { font-family: 'Share Tech Mono', monospace; font-size: 1.4rem; font-weight: 700; color: rgba(255,255,255,0.5); }
    .active .motor-num { color: #fff; }
    .motor-label { font-size: 0.55rem; color: var(--muted); font-family: 'Share Tech Mono', monospace; }
    .divider { width: 100%; max-width: 420px; display: flex; align-items: center; gap: 12px; }
    .divider-line { flex: 1; height: 1px; background: var(--border); }
    .divider-text { font-family: 'Share Tech Mono', monospace; font-size: 0.6rem; color: var(--muted); text-transform: uppercase; }
    .log { width: 100%; max-width: 420px; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 10px 14px; font-family: 'Share Tech Mono', monospace; font-size: 0.65rem; color: var(--muted); min-height: 40px; }
    body.disconnected .motor-btn { opacity: 0.4; pointer-events: none; }
  </style>
</head>
<body class="disconnected">
  <h1>⚡ Haptic Vest Controller</h1>
  <div class="status-bar">
    <div class="status-indicator">
      <div class="status-dot" id="statusDot"></div>
      <span class="status-text" id="statusText">DISCONNECTED</span>
    </div>
    <button class="connect-btn" id="connectBtn" onclick="toggleConnect()">Connect</button>
  </div>
  <div class="motor-section"><div class="section-label front">▲ Front Motors</div><div id="frontRow" class="motor-row"></div></div>
  <div class="divider"><div class="divider-line"></div><div class="divider-text">vest</div><div class="divider-line"></div></div>
  <div class="motor-section"><div class="section-label back">▼ Back Motors</div><div id="backRow" class="motor-row"></div></div>
  <div class="log" id="log">Waiting for connection...</div>

  <script>
    const SERVICE_UUID = '6e400001-b5a3-f393-e0a9-e50e24dcca9e';
    const CHARACTERISTIC_UUID = '6e400002-b5a3-f393-e0a9-e50e24dcca9e';
    let device = null, characteristic = null;

    function buildButtons(containerId, startNum, type) {
      const row = document.getElementById(containerId);
      const labels = ['UL', 'UR', 'LL', 'LR'];
      for (let i = 0; i < 4; i++) {
        const num = startNum + i;
        const btn = document.createElement('div');
        btn.className = `motor-btn ${type}`;
        btn.innerHTML = `<span class="motor-num">${num}</span><span class="motor-label">${labels[i]}</span>`;
        btn.onpointerdown = (e) => { e.preventDefault(); trigger(num, 1, btn); };
        btn.onpointerup = (e) => { e.preventDefault(); trigger(num, 0, btn); };
        btn.onpointerleave = (e) => { e.preventDefault(); trigger(num, 0, btn); };
        row.appendChild(btn);
      }
    }
    buildButtons('frontRow', 1, 'front');
    buildButtons('backRow', 5, 'back');

    async function trigger(num, state, btn) {
      if (!characteristic) return;
      state === 1 ? btn.classList.add('active') : btn.classList.remove('active');
      const data = new TextEncoder().encode(`!B${num}${state}`);
      try { await characteristic.writeValueWithoutResponse(data); } catch (e) {}
    }

    async function toggleConnect() {
      if (device && device.gatt.connected) device.gatt.disconnect();
      else {
        try {
          log('Scanning...');
          device = await navigator.bluetooth.requestDevice({ filters: [{ namePrefix: 'Hapt' }], optionalServices: [SERVICE_UUID] });
          device.addEventListener('gattserverdisconnected', onDisconnected);
          const server = await device.gatt.connect();
          const service = await server.getPrimaryService(SERVICE_UUID);
          characteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);
          onConnected();
        } catch (err) { log('Error: ' + err.message); }
      }
    }
    function onConnected() {
      document.getElementById('statusDot').classList.add('connected');
      document.getElementById('statusText').textContent = 'CONNECTED';
      document.getElementById('connectBtn').textContent = 'Disconnect';
      document.getElementById('connectBtn').classList.add('disconnect');
      document.body.classList.remove('disconnected');
      log('System Ready.');
    }
    function onDisconnected() {
      document.getElementById('statusDot').classList.remove('connected');
      document.getElementById('statusText').textContent = 'DISCONNECTED';
      document.getElementById('connectBtn').textContent = 'Connect';
      document.getElementById('connectBtn').classList.remove('disconnect');
      document.body.classList.add('disconnected');
      characteristic = null;
      log('Disconnected.');
    }
    function log(m) { document.getElementById('log').innerHTML = m; }
  </script>
</body>
</html>
